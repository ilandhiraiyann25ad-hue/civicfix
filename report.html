<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Problem - CivicFix</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <nav>
        <div class="logo">🏙️ CivicFix</div>

        <div class="nav-links">
            <a href="index.html">🏠 Home</a>
            <a href="report.html">📢 Report Problem</a>
            <a href="track.html">🔎 Track Complaint</a>
            <a href="dashboard.html">📊 Dashboard</a>
        </div>
    </nav>
</header>

<section class="hero">
    <div class="hero-content">
        <h1>Report a Civic Problem</h1>
        <p>Help us identify and resolve problems in your area.</p>
    </div>
</section>

<section class="form-section">

    <div class="form-container">

        <h2>Submit Complaint</h2>

        <form id="complaintForm">

            <label for="category">Problem Category</label>

            <select id="category" name="category" required>
                <option value="">Select Category</option>
                <option value="Road Damage">Road Damage</option>
                <option value="Drainage Leakage">Drainage Leakage</option>
                <option value="Garbage Dump">Garbage Dump</option>
                <option value="Waterlogging">Waterlogging</option>
                <option value="Street Light Problem">Street Light Problem</option>
                <option value="Public Toilet - No Water">Public Toilet - No Water</option>
                <option value="Public Toilet - No Electricity">Public Toilet - No Electricity</option>
                <option value="Public Toilet - Blockage">Public Toilet - Blockage</option>
                <option value="Unclean Public Toilet">Unclean Public Toilet</option>
                <option value="Open Manhole">Open Manhole</option>
                <option value="Dead Animal Removal">Dead Animal Removal</option>
            </select>


            <label for="department">Assigned Department</label>

            <input
                type="text"
                id="department"
                name="department"
                readonly
                placeholder="Department will appear automatically"
            >


            <label for="location">Location</label>

            <div class="location-row">

                <input
                    type="text"
                    id="location"
                    name="location"
                    placeholder="Enter location"
                    required
                >

                <button
                    type="button"
                    id="getLocation"
                >
                    📍 Get Location
                </button>

            </div>


            <label for="description">Problem Description</label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe the problem..."
                required
            ></textarea>


            <label for="photo">Problem Photo</label>

            <input
                type="file"
                id="photo"
                name="photo"
                accept="image/*"
            >


            <button
                type="submit"
                class="submit-btn"
            >
                🚀 Submit Complaint
            </button>

        </form>

    </div>

</section>


<footer>
    <p>© 2026 CivicFix - Smart Civic Complaint & Action Tracking System</p>
</footer>


<script src="script.js"></script>

</body>
</html>
