<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CivicFix - Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <div class="logo">
        🏙️ CivicFix
    </div>

    <nav>

        <a href="index.html">
            🏠 Home
        </a>

        <a href="report.html">
            📢 Report Problem
        </a>

        <a href="track.html">
            🔎 Track Complaint
        </a>

        <a href="dashboard.html">
            📊 Dashboard
        </a>

    </nav>

</header>



<section class="section">

    <h2>
        👨‍💼 Authority Dashboard
    </h2>


    <div class="stats">


        <div class="stat-card">

            <h3 id="total">
                0
            </h3>

            <p>
                Total Complaints
            </p>

        </div>


        <div class="stat-card">

            <h3 id="pending">
                0
            </h3>

            <p>
                Pending
            </p>

        </div>


        <div class="stat-card">

            <h3 id="progress">
                0
            </h3>

            <p>
                In Progress
            </p>

        </div>


        <div class="stat-card">

            <h3 id="completed">
                0
            </h3>

            <p>
                Completed
            </p>

        </div>


    </div>



    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Problem</th>

                    <th>Location</th>

                    <th>Department</th>

                    <th>Status</th>

                    <th>Update Status</th>

                    <th>Worker</th>

                    <th>After Work Photo</th>

                </tr>

            </thead>


            <tbody id="complaintTable">

            </tbody>

        </table>

    </div>

</section>



<footer>

    <h3>
        🏙️ CivicFix
    </h3>

    <p>
        Smart Civic Complaint & Action Tracking System
    </p>

</footer>



<script src="script.js"></script>

</body>

</html>
